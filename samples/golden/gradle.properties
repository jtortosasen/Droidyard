# The golden sample's build properties (plan D2).
#
# The decisive m1l check is the SDK stamp: AGP must never install or rewrite an SDK
# package. It cannot even try, because sdkDownload is off.
android.builder.sdkDownload=false
# Compose needs AndroidX. The 1h fixtures set this false; the sample needs it true.
android.useAndroidX=true
# As the 1h fixtures: a daemon stops a minute after the last build, so a run leaves no
# Gradle daemon of its own behind.
org.gradle.daemon.idletimeout=60000
org.gradle.jvmargs=-Xmx2048m
