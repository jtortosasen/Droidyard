# A pushed vX.Y.Z tag runs the same checks as CI, builds the four targets, then publishes
# a GitHub Release (ADR-0068 §2, §3). Publishing shares no job with the build.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  # v1.2.3-rc.1 matches the tag glob; only vMAJOR.MINOR.PATCH is released, and a tag that
  # is not one stops here, before any check or build runs.
  tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - name: Tag shape
        run: |
          printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
            echo "tag '$TAG' is not vMAJOR.MINOR.PATCH; nothing is published" >&2
            exit 1
          }

  checks:
    needs: tag
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      # The whole history and the tags: the notes list what main gained since the last tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # A release build restores no cache: one written by another ref must not reach it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          package-manager-cache: false
      - name: Web dependencies
        run: pnpm -C web install --frozen-lockfile
      - name: Build
        run: release/build.sh "$TAG" "$RUNNER_TEMP/release"
      - name: Release notes
        run: release/notes.sh "$TAG" >"$RUNNER_TEMP/release/notes.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
          if-no-files-found: error

  # No checkout, no repository code, no npm: the only job that holds the write token.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Verify checksums
        run: |
          cd release
          sha256sum -c checksums.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file release/notes.md \
            release/droidyard_*.tar.gz release/checksums.txt
