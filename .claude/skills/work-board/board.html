<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero de Droidyard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Generated by .claude/skills/work-board/board.go page; edit board.html, not the output. */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --ink:#1b2420; --muted:#5d6b64; --line:#d9e0db;
  --accent:#2f6f5e; --accent-soft:#e1efe9;
  --new:#7a4fb3; --new-soft:#efe8f8; --later:#8a6a1f; --later-soft:#f6efdc; --none:#6b6f74; --none-soft:#eceeef;
  --warn:#b4462f; --warn-soft:#f8e6e1;
  --k-limit:#b4462f; --k-unver:#8a6a1f; --k-def:#3b6aa0; --k-q:#7a4fb3;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121815; --surface:#1a221e; --ink:#e6ece8; --muted:#9aa8a1; --line:#2c3833;
  --accent:#7cc4ad; --accent-soft:#1f3a31; --new:#c3a3ef; --new-soft:#2c2340; --later:#e0bf6a; --later-soft:#3a3018; --none:#aab0b5; --none-soft:#272c2f;
  --warn:#ef8a73; --warn-soft:#3a221c;
  --k-limit:#ef8a73; --k-unver:#e0bf6a; --k-def:#8fb6e6; --k-q:#c3a3ef; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --ink:#e6ece8; --muted:#9aa8a1; --line:#2c3833;
  --accent:#7cc4ad; --accent-soft:#1f3a31; --new:#c3a3ef; --new-soft:#2c2340; --later:#e0bf6a; --later-soft:#3a3018; --none:#aab0b5; --none-soft:#272c2f;
  --warn:#ef8a73; --warn-soft:#3a221c;
  --k-limit:#ef8a73; --k-unver:#e0bf6a; --k-def:#8fb6e6; --k-q:#c3a3ef; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:28px 16px 64px;display:flex;flex-direction:column;gap:30px}
h1{font-size:30px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;margin:0;font-weight:600}
h3{font-size:12px;margin:0;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
p{margin:0;max-width:72ch}
code{font-family:var(--mono);font-size:12.5px;background:var(--bg);padding:0 4px;border-radius:3px}
.lede{color:var(--muted)}
.tally{display:flex;flex-wrap:wrap;gap:8px 18px;font-variant-numeric:tabular-nums}
.tally span{display:inline-flex;align-items:baseline;gap:6px}
.tally b{font-size:20px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;transform:translateY(-1px)}
section{display:flex;flex-direction:column;gap:12px}
.group{display:flex;flex-direction:column;gap:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{all:unset;box-sizing:border-box;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
button.card{cursor:pointer}
button.card:hover{border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.card.lane{border-left:4px solid var(--accent)}
.card.lane.closing{border-left-color:var(--later)}
.card.problem{border-left:4px solid var(--warn);background:var(--warn-soft)}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.card .name{font-weight:600;overflow-wrap:anywhere}
.card .n{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.card .desc{color:var(--muted);font-size:13.5px;overflow-wrap:anywhere}
.tag{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;align-self:flex-start}
.t-new{color:var(--new);background:var(--new-soft)} .t-planned{color:var(--accent);background:var(--accent-soft)}
.t-later{color:var(--later);background:var(--later-soft)} .t-none{color:var(--none);background:var(--none-soft)}
.t-warn{color:var(--warn);background:var(--warn-soft)}
.plans{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.plan{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:8px 14px;border-top:1px solid var(--line);align-items:baseline}
.plan:first-child{border-top:0}
.plan .id{font-family:var(--mono);font-size:13px;color:var(--muted)}
.plan .st{font-size:12px;color:var(--muted)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;position:sticky;top:0;background:var(--bg);padding-block:10px;z-index:2;border-bottom:1px solid var(--line)}
.chip{all:unset;cursor:pointer;font-size:13px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=search]{flex:1 1 220px;min-width:0;font:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.current{font-size:14px;color:var(--muted)} .current b{color:var(--ink)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.row{display:grid;grid-template-columns:120px 1fr;gap:4px 14px;padding:10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.meta{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.kind{font-weight:600;font-size:12px}
.k-limit{color:var(--k-limit)} .k-unverified{color:var(--k-unver)} .k-deferred{color:var(--k-def)} .k-open{color:var(--k-q)}
.text{min-width:0;overflow-wrap:anywhere;font-size:14px}
.empty{padding:16px 14px;color:var(--muted)}
.areahead{padding:8px 14px;background:var(--bg);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-top:1px solid var(--line)}
.areahead:first-child{border-top:0}
.note{font-size:13px;color:var(--muted)}
summary.note{cursor:pointer}
@media (max-width:560px){.row{grid-template-columns:1fr}.meta{flex-direction:row;flex-wrap:wrap;gap:4px 10px}.plan{grid-template-columns:44px 1fr}.plan .st{grid-column:2}}
@media (prefers-reduced-motion:no-preference){button.card{transition:border-color .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:10px">
    <h1>Tablero de Droidyard</h1>
    <p class="lede" id="lede"></p>
    <div class="tally" id="tally"></div>
  </header>

  <section>
    <h2>En curso</h2>
    <div class="cards" id="lanes"></div>
  </section>

  <section>
    <h2>Milestones</h2>
    <div class="plans" id="plans"></div>
    <details><summary class="note" id="donesum"></summary><div class="plans" id="done" style="margin-top:8px"></div></details>
  </section>

  <section>
    <h2>Trabajo abierto</h2>
    <p class="note">Cada fila abierta del registro, por el trabajo que la cerraría (la columna <code>Work</code>). Pulsa una tarjeta para ver sus filas.</p>
    <div class="group"><h3>Capacidades de la visión (vision/beyond.md)</h3><div class="cards" id="g-new"></div></div>
    <div class="group"><h3>Milestones y versión 1</h3><div class="cards" id="g-planned"></div></div>
    <div class="group"><h3>Sin milestone propio</h3><div class="cards" id="g-none"></div></div>
  </section>

  <section>
    <div class="toolbar">
      <span class="current" id="current"></span>
      <span style="flex:1 1 0"></span>
      <span id="kinds" style="display:flex;flex-wrap:wrap;gap:6px"></span>
      <input type="search" id="q" placeholder="Buscar en las filas" aria-label="Buscar en las filas">
    </div>
    <div class="list" id="list"></div>
  </section>
</div>
<script>
const D = /*DATA*/null;
const W = {
  C1:{g:'new',tag:'Visión',name:'C1 · Proyectos de cualquier lenguaje',desc:'Tipo de proyecto detectado y dominios por tipo: Python o JVM sin Android ven solo lo genérico.'},
  C2:{g:'new',tag:'Visión',name:'C2 · Sesiones con worktrees',desc:'Terminal en el daemon; el agente toma o crea su worktree, con contexto por worktree.'},
  C3:{g:'new',tag:'Visión',name:'C3 · Vista en vivo del dispositivo',desc:'Pantalla en vivo con entrada; base de C4 y C5.'},
  C4:{g:'new',tag:'Visión',name:'C4 · Dispositivo remoto',desc:'Un Droidyard expone su teléfono a otro. Autenticación, TLS, depuración remota.'},
  C5:{g:'new',tag:'Visión',name:'C5 · Flujos grabados',desc:'Grafo de pantallas y acciones que se reproduce de forma semi determinista.'},
  C6:{g:'new',tag:'Visión',name:'C6 · Motor e2e y granja',desc:'Ejecutor sin la parte de desarrollo, varios dispositivos, dispositivos físicos.'},
  'git':{g:'planned',tag:'Git',name:'Git: lo que queda',desc:'Push, merge, rebase, stash, ramas, marcas de Git en el editor.'},
  'v1-code':{g:'planned',tag:'Versión 1',name:'Inteligencia de código',desc:'LSP de Kotlin, búsqueda en el proyecto, resaltado.'},
  'v1-test':{g:'planned',tag:'Versión 1',name:'build.test',desc:'Tests como capacidad, tests instrumentados.'},
  'v1-device':{g:'planned',tag:'Versión 1',name:'Más capacidades de dispositivo',desc:'Procesos, force stop, backtrace, emparejado inalámbrico.'},
  'v1-sdk':{g:'planned',tag:'Versión 1',name:'SDK y emuladores',desc:'Instalar paquetes, licencias, crear y borrar emuladores.'},
  'distribution':{g:'planned',tag:'Más adelante',name:'Distribución pública',desc:'Repo público, firma, registros de MCP, actualizaciones reales.'},
  'platforms':{g:'planned',tag:'Más adelante',name:'Linux, Intel y Windows',desc:'Daemon real en Linux, pruebas que hoy solo corren en el Mac, Windows.'},
  'quick':{g:'none',tag:'Arreglos rápidos',name:'Defectos pequeños',desc:'Se arreglan en cualquier momento, sin plan.'},
  'review':{g:'none',tag:'Tu revisión',name:'Ronda de revisión de la UI',desc:'Lo marcado para la próxima tanda de revisión.'},
  'trial':{g:'none',tag:'Pruebas reales',name:'Pruebas con clientes reales',desc:'Safari, Firefox, Claude Code, Cursor IDE de verdad.'},
  '':{g:'none',tag:'Sin trabajo asignado',name:'Límites y comprobaciones sueltos',desc:'Ningún trabajo previsto los cierra; se abordan cuando molesten.'},
};
const KINDS = [['limit','Límite','k-limit','var(--k-limit)'],['unverified','Sin verificar','k-unverified','var(--k-unver)'],['deferred','Aplazado','k-deferred','var(--k-def)'],['open question','Pregunta','k-open','var(--k-q)']];
const ROWS = D.rows;
const info = k => W[k] || {g:'planned',tag:'Milestone',name:'Milestone '+k,desc:'Filas que ese milestone se propone cerrar.'};
let sel = 'ALL', kindSel = new Set(), q = '';
try { const s = JSON.parse(localStorage.getItem('dy-board') || '{}'); if (s.sel) sel = s.sel; } catch {}
if (sel !== 'ALL' && !ROWS.some(r => r.work === sel)) sel = 'ALL';
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
function rich(node, text){ text.split('`').forEach((part,i)=>{ if(!part) return; if(i%2) node.append(el('code','',part)); else node.append(part); }); }

function header(){
  const l = document.getElementById('lede');
  l.append('Generado el '+D.generated+' desde ', el('code','','main'), ' ('+D.main+'). Se regenera al empezar y al cerrar cada trabajo. Los textos de las filas están en inglés, como en el registro.');
  const t = document.getElementById('tally');
  const items = [[D.lanes.length,'en curso','var(--accent)'],[ROWS.length,'filas abiertas',null]].concat(KINDS.map(k => [ROWS.filter(r=>r.kind===k[0]).length, k[1].toLowerCase(), k[3]])).concat([[D.closed,'cerradas','var(--none)']]);
  for (const [n,label,color] of items){ const s=el('span'); if(color){const d=el('i','dot');d.style.background=color;s.append(d);} s.append(el('b','',n),' '+label); t.append(s); }
}
function lanes(){
  const box = document.getElementById('lanes');
  for (const l of D.lanes){
    const c = el('div','card lane'+(l.state==='closing'?' closing':'')+(l.problem?' problem':''));
    c.append(el('span','tag '+(l.state==='closing'?'t-later':'t-planned'), l.state==='closing'?'Cerrando':'En curso'));
    const top = el('span','top'); top.append(el('span','name',l.id+' · '+l.what), el('span','n','+'+l.ahead)); c.append(top);
    c.append(el('span','desc','Rama '+l.branch+' · plan: '+(l.planStatus||'sin escribir')+' · desde '+l.since));
    c.append(el('span','desc','Toca: '+l.touches.split(',').join(', ')+(l.adr&&l.adr!=='-'?' · ADR '+l.adr:'')));
    if (l.lastCommit) c.append(el('span','desc','Último commit: '+l.lastCommit));
    if (l.problem) c.append(el('span','tag t-warn',l.problem));
    box.append(c);
  }
  for (const o of D.orphans){ const c = el('div','card problem'); c.append(el('span','tag t-warn','Sin carril'), el('span','desc',o)); box.append(c); }
  if (!D.lanes.length && !D.orphans.length){ const c = el('div','card'); c.append(el('span','name','Nada en paralelo'), el('span','desc','Siguiente milestone libre: '+D.next)); box.append(c); }
}
function cards(){
  for (const g of ['new','planned','none']) document.getElementById('g-'+g).textContent='';
  const counts = {}; for (const r of ROWS) counts[r.work] = (counts[r.work]||0)+1;
  const keys = Object.keys(W).filter(k => counts[k]).concat(Object.keys(counts).filter(k => !(k in W)).sort());
  const all = el('button','card'); all.setAttribute('aria-pressed', sel==='ALL');
  all.append(el('span','tag t-none','Todo')); const at = el('span','top'); at.append(el('span','name','Todas las filas'), el('span','n',ROWS.length)); all.append(at, el('span','desc','El registro abierto entero, por áreas.'));
  all.onclick = () => pick('ALL'); document.getElementById('g-none').append(all);
  for (const k of keys){
    const v = info(k), c = el('button','card'); c.setAttribute('aria-pressed', sel===k);
    c.append(el('span','tag '+({new:'t-new',planned:'t-planned',none:'t-none'})[v.g], v.tag));
    const top = el('span','top'); top.append(el('span','name',v.name), el('span','n',counts[k]+(counts[k]===1?' fila':' filas'))); c.append(top, el('span','desc',v.desc));
    c.onclick = () => pick(k); document.getElementById('g-'+v.g).append(c);
  }
}
function kindChips(){
  const box=document.getElementById('kinds'); box.textContent='';
  for (const [k,label,,color] of KINDS){
    const b=el('button','chip'); b.setAttribute('aria-pressed', kindSel.has(k));
    const d=el('i','dot'); d.style.background=color; b.append(d, label);
    b.onclick=()=>{ kindSel.has(k)?kindSel.delete(k):kindSel.add(k); kindChips(); list(); };
    box.append(b);
  }
}
function list(){
  const box=document.getElementById('list'); box.textContent='';
  let rs = ROWS.filter(r => (sel==='ALL'||r.work===sel) && (!kindSel.size||kindSel.has(r.kind)) && (!q||(r.item+' '+r.area).toLowerCase().includes(q)));
  const cur=document.getElementById('current'); cur.textContent='';
  cur.append(el('b','', sel==='ALL' ? 'Todas las filas' : info(sel).name), ' · '+rs.length+(rs.length===1?' fila':' filas'));
  if(!rs.length){ box.append(el('div','empty','Ninguna fila con estos filtros.')); return; }
  let last=null;
  rs = rs.slice().sort((a,b)=>a.area.localeCompare(b.area));
  for (const r of rs){
    if (r.area!==last){ box.append(el('div','areahead',r.area)); last=r.area; }
    const row=el('div','row'), m=el('div','meta');
    const k=KINDS.find(x=>x[0]===r.kind);
    m.append(el('span','kind '+(k?k[2]:''), k?k[1]:r.kind));
    if (sel==='ALL' && r.work) m.append(el('span','',info(r.work).name.split(' · ')[0]));
    m.append(el('span','','desde '+r.rec));
    const t=el('div','text'); rich(t, r.item);
    row.append(m,t); box.append(row);
  }
}
function plans(){
  const open = D.plans.filter(p => p.status !== 'Done'), done = D.plans.filter(p => p.status === 'Done').reverse();
  const show = box => p => { const r = el('div','plan'); r.append(el('span','id',p.id), el('span','',p.title), el('span','st',p.status==='Done'?'Hecho':p.status)); box.append(r); };
  const box = document.getElementById('plans');
  if (open.length) open.forEach(show(box)); else box.append(el('div','empty','Ningún plan abierto. Siguiente milestone libre: '+D.next+'.'));
  done.slice(0,3).forEach(show(box));
  document.getElementById('donesum').textContent = 'Todos los hechos ('+done.length+')';
  done.forEach(show(document.getElementById('done')));
}
function pick(k){ sel=k; try{localStorage.setItem('dy-board', JSON.stringify({sel}))}catch{} cards(); list(); }
document.getElementById('q').addEventListener('input', e=>{ q=e.target.value.trim().toLowerCase(); list(); });
header(); lanes(); cards(); kindChips(); list(); plans();
</script>
</body>
</html>
